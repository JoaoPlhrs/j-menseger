[package]
name = "jm-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Áudio, vídeo e captura de tela do J-Menseger"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes = "1"
webrtc = "0.17"
cpal = "0.18"
opus = "0.4"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
base64 = "0.22"
# Importar áudio para o soundboard (MP3, M4A/AAC, WAV, FLAC, Ogg Vorbis).
# Tudo em Rust: nada a mais para compilar no Windows.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "wav", "pcm", "vorbis", "ogg"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[build-dependencies]
bindgen = "0.72"
cc = "1"
pkg-config = "0.3"
