[package]
name = "jm-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "J-Menseger para computador: interface nativa"

[[bin]]
name = "j-menseger"
path = "src/main.rs"

[dependencies]
jm-core = { path = "../jm-core" }
jm-media = { path = "../jm-media" }
anyhow.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util = "0.3"
iced = { version = "0.14", features = ["tokio", "image", "svg", "advanced", "qr_code", "canvas"] }
base64 = "0.22"
# Horário local (o fuso vem do sistema).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Escolher arquivos: diálogo nativo no Windows, portal do sistema no Linux.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
# Notificações do sistema (Linux via D-Bus, Windows via WinRT).
notify-rust = "4"
# Conferir o arquivo baixado da atualização.
sha2 = "0.10"
hex = "0.4"
# Busca de GIFs no Tenor e no Giphy (HTTPS com rustls, o mesmo do resto).
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[target.'cfg(windows)'.dependencies]
# Esconder a janela das capturas de tela (SetWindowDisplayAffinity).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_Com", "Win32_Security"] }
# Atalhos (.lnk) do instalador.
mslnk = "0.1"
# Notificação com campo de resposta (o mesmo pacote que o notify-rust usa).
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Data_Xml_Dom", "UI_Notifications"] }
# Ícone na bandeja (perto do relógio) para continuar ligado com a janela fechada.
tray-icon = { version = "0.21", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Música tocando no Spotify (MPRIS, pelo D-Bus da sessão).
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

# Sem `[target.'cfg(windows)']`: ao compilar do Linux para o Windows essa
# condição olharia para a máquina que compila, e a dependência não entraria.
[build-dependencies]
winresource = "0.1"
