          <div class="chips" id="chips">
            <button class="chip on" data-act="filter" data-f="all">Todas</button>
            <button class="chip" data-act="filter" data-f="unread">Não lidas</button>
            <button class="chip" data-act="filter" data-f="people">Pessoas</button>
            <button class="chip" data-act="filter" data-f="groups">Grupos</button>
          </div>
          <div id="netbar"></div>
          <div class="scroll" id="chatList"></div>
        </section>

        <section class="panel" id="tab-groups" aria-label="Grupos">
          <header class="topbar">
            <h1 class="ttl">Grupos</h1>
            <div class="grow"></div>
            <button class="ibtn" data-act="newGroup" aria-label="Criar grupo"><svg class="i"><use href="#i-plus"/></svg></button>
          </header>
          <div class="scroll" id="groupList"></div>
        </section>

        <section class="panel" id="tab-calls" aria-label="Chamadas">
          <header class="topbar">
            <h1 class="ttl">Chamadas</h1>
            <div class="grow"></div>
            <button class="ibtn" data-act="clearCalls" aria-label="Limpar histórico"><svg class="i"><use href="#i-trash"/></svg></button>
          </header>
          <div class="scroll" id="callList"></div>
        </section>

        <section class="panel" id="tab-settings" aria-label="Ajustes">
          <header class="topbar"><h1 class="ttl">Ajustes</h1></header>
          <div class="scroll" id="setList"></div>
        </section>

        <button class="fab" id="fab" data-act="fab" aria-label="Nova conversa"></button>
      </div>

      <nav class="nav" id="nav" aria-label="Seções">
        <button class="navbtn on" data-act="tab" data-tab="chats"><span class="pill"><svg class="i"><use href="#i-chat"/></svg><b class="nbadge" id="nb-chats" hidden></b></span>Conversas</button>
        <button class="navbtn" data-act="tab" data-tab="groups"><span class="pill"><svg class="i"><use href="#i-users"/></svg><b class="nbadge" id="nb-groups" hidden></b></span>Grupos</button>
        <button class="navbtn" data-act="tab" data-tab="calls"><span class="pill"><svg class="i"><use href="#i-phone"/></svg><b class="nbadge" id="nb-calls" hidden></b></span>Chamadas</button>
        <button class="navbtn" data-act="tab" data-tab="settings"><span class="pill"><svg class="i"><use href="#i-sliders"/></svg></span>Ajustes</button>
      </nav>
    </section>

    <div class="scrim" id="scrim" data-act="closeSheet"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
    <section class="calllayer" id="call" aria-label="Chamada"></section>
    <button class="callpill" id="callpill" data-act="callShow" hidden></button>
    <div class="inapp" id="inapp" hidden></div>
    <div class="viewer" id="viewer" hidden></div>
    <section class="auth nobar" id="auth" aria-label="Entrar no J-Menseger" hidden>
      <div class="abar"><button class="ibtn" data-act="authBack" aria-label="Voltar"><svg class="i"><use href="#i-back"/></svg></button><div class="aprog" id="aprog"></div></div>
      <div class="asteps" id="asteps"></div>
    </section>
    <section class="lock" id="lock" hidden></section>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
